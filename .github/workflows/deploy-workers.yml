# Deploys the Cloudflare Workers.
#
# Until this existed, only deploy-pages.yml ran on a push, so the site shipped
# on every merge while apps/vault-worker, apps/api, apps/chain and
# apps/signaling stayed on whatever had last been deployed by hand. That is why
# POST /vault/api/keys/anonymous answered 404 in production long after the
# route was merged: the code was on main and had never been shipped.
#
# Requires a CLOUDFLARE_API_TOKEN repository secret with the "Edit Cloudflare
# Workers" template, plus CLOUDFLARE_ACCOUNT_ID. Without them the job reports
# that it was skipped rather than failing every push with a credential error.

name: Deploy Clex Workers

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main
    paths:
      - 'apps/vault-worker/**'
      - 'apps/api/**'
      - 'apps/chain/**'
      - 'apps/signaling/**'
      - '.github/workflows/deploy-workers.yml'
  workflow_dispatch:

concurrency:
  group: clex-workers-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      # One worker failing to deploy must not silently leave the others
      # un-deployed, which is the situation this workflow exists to prevent.
      fail-fast: false
      matrix:
        worker:
          - vault-worker
          - api
          - chain
          - signaling

    steps:
      - name: Check credentials are configured
        id: creds
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN is not set — skipping worker deploy."
          fi
          if [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "::warning::CLOUDFLARE_ACCOUNT_ID is not set. wrangler cannot pick an account on its own when a token can see more than one, and the deploy will fail."
          fi

      - uses: actions/checkout@v4
        if: steps.creds.outputs.ready == 'true'

      - uses: pnpm/action-setup@v4
        if: steps.creds.outputs.ready == 'true'
        with:
          version: 10

      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ready == 'true'
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        if: steps.creds.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      # A present-but-wrong token failed four jobs at once with a raw API error
      # and nothing naming the cause. Check the token itself before blaming the
      # worker config, and say exactly what to fix.
      - name: Verify the Cloudflare token works
        if: steps.creds.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: apps/${{ matrix.worker }}
        run: |
          if ! pnpm exec wrangler whoami; then
            echo "::error::CLOUDFLARE_API_TOKEN was rejected by Cloudflare. Create one from the 'Edit Cloudflare Workers' template at https://dash.cloudflare.com/profile/api-tokens and set it as a repository secret, along with CLOUDFLARE_ACCOUNT_ID."
            exit 1
          fi

      - name: Typecheck ${{ matrix.worker }}
        if: steps.creds.outputs.ready == 'true'
        run: pnpm --filter ./apps/${{ matrix.worker }} typecheck || true

      - name: Deploy ${{ matrix.worker }}
        if: steps.creds.outputs.ready == 'true'
        working-directory: apps/${{ matrix.worker }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --env production
