<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="icon" type="image/png" href="/brand/clex-logo.png">
  <link rel="apple-touch-icon" href="/brand/clex-logo.png">
  <title>View Secret — Clex Vault</title>
  <meta name="description" content="View a one-time encrypted secret shared via Clex Vault.">
  <meta name="robots" content="noindex, nofollow">
  <!-- Prevent any caching of this page — content is sensitive -->
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <script>
    (() => {
      try {
        const theme = localStorage.getItem('clex-theme') === 'light' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.classList.toggle('dark', theme === 'dark');
        document.documentElement.style.colorScheme = theme;
      } catch {
        document.documentElement.setAttribute('data-theme', 'dark');
        document.documentElement.classList.add('dark');
        document.documentElement.style.colorScheme = 'dark';
      }
    })();
  </script>

  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/animations.css">
  <link rel="stylesheet" href="/css/pages/vault.css">

  <script type="module" src="/js/main.js"></script>
</head>

<body data-page="vault-secret">

  <main class="vault-secret-shell">
    <div id="vault-secret-app-island"></div>
  </main>

</body>

</html>
