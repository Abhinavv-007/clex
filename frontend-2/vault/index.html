<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://api.fontshare.com" crossorigin>
  <script>document.documentElement.classList.add('clex-design-booting');</script>
  <link rel="icon" type="image/png" href="/brand/clex-logo.png">
  <link rel="apple-touch-icon" href="/brand/clex-logo.png">
  <title>Vault — Clex | Private Encrypted Notes</title>
  <meta name="description"
    content="Clex Vault: a private, end-to-end encrypted workspace for notes, one-time secrets, and timed Google Drive share links. Your keys stay on your device. Works offline and syncs peer-to-peer.">
  <meta name="robots" content="noindex">
  <script>
    (() => {
      try {
        const theme = localStorage.getItem('clex-theme-v2') === 'dark' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.classList.toggle('dark', theme === 'dark');
        document.documentElement.style.colorScheme = theme;
      } catch {
        document.documentElement.setAttribute('data-theme', 'light');
        document.documentElement.classList.remove('dark');
        document.documentElement.style.colorScheme = 'light';
      }
    })();
  </script>

  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/animations.css">
  <link rel="stylesheet" href="/css/pages/home.css">
  <link rel="stylesheet" href="/css/pages/vault.css">
  <link rel="stylesheet" href="/css/global-enhance.css">
  <link rel="stylesheet" href="/css/creem-design.css">
  <link rel="stylesheet" href="/css/cinematic.css">

  <script type="module" src="/js/main.js"></script>
</head>

<body data-page="vault">

  <!-- ═══ Navigation ═══ -->
  <nav class="nav" id="main-nav">
    <div class="nav__inner">
      <a href="/" class="nav__logo" aria-label="Clex home">
        <img src="/brand/clex-logo.png" alt="" class="nav__logo-image">
        <span class="nav__logo-wordmark">Clex</span>
      </a>
      <div class="nav__links">
        <a href="/features" class="nav__link" data-page="features">Features</a>
        <a href="/vault" class="nav__link" data-page="vault">Vault</a>
        <a href="/how-it-works" class="nav__link" data-page="how-it-works">How It Works</a>
        <a href="/chain" class="nav__link" data-page="chain">Chain</a>
        <a href="/developers" class="nav__link" data-page="developers">Developers</a>
        <a href="/getting-started" class="nav__link" data-page="getting-started">Get Started</a>
        <a href="/faq" class="nav__link" data-page="faq">FAQ</a>
      </div>
      <div class="nav__actions">
        <button class="nav__theme-toggle" id="theme-toggle" aria-label="Toggle theme">☀</button>
        <a href="/workspace" class="btn btn--primary btn--small desktop-only">Open Workspace →</a>
      </div>
      <button class="nav__hamburger" id="nav-hamburger" aria-label="Toggle menu">
        <span class="nav__hamburger-line"></span>
        <span class="nav__hamburger-line"></span>
        <span class="nav__hamburger-line"></span>
      </button>
    </div>
  </nav>
  <div class="nav__mobile-menu" id="nav-mobile-menu">
    <a href="/" class="nav__mobile-link">Home</a>
    <a href="/features" class="nav__mobile-link">Features</a>
    <a href="/how-it-works" class="nav__mobile-link">How It Works</a>
    <a href="/chain" class="nav__mobile-link">Chain</a>
    <a href="/developers" class="nav__mobile-link">Developers</a>
    <a href="/getting-started" class="nav__mobile-link">Get Started</a>
    <a href="/faq" class="nav__mobile-link">FAQ</a>
    <a href="/vault" class="nav__mobile-link" style="color: var(--accent-text);">Vault →</a>
  </div>

  <main class="vault-shell">
    <div id="vault-app-island"></div>
  </main>

</body>

</html>
