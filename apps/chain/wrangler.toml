name = "clex-chain"
main = "src/index.ts"
compatibility_date = "2024-05-29"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[durable_objects]
bindings = [
  { name = "LEDGER", class_name = "ChainLedger" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChainLedger"]

[[d1_databases]]
binding = "DB"
database_name = "clex-chain"
database_id = "b2a1c87d-ae8d-4d92-957d-b04fa74c15b0"

# The api worker's KV namespace (DRIVE_SESSION_STORE there), bound here only
# to read clex.in/admin console sessions. See src/adminSession.ts.
[[kv_namespaces]]
binding = "ADMIN_SESSIONS"
id = "eea542853aed48cb94933b5ec022e35d"

[vars]
ALLOWED_ORIGIN = "*"

# ── Production ────────────────────────────────────────────────────────────────
[env.production]
name = "clex-chain-prod"

[env.production.durable_objects]
bindings = [
  { name = "LEDGER", class_name = "ChainLedger" }
]

[[env.production.migrations]]
tag = "v1"
new_sqlite_classes = ["ChainLedger"]

[[env.production.d1_databases]]
binding = "DB"
database_name = "clex-chain"
database_id = "b2a1c87d-ae8d-4d92-957d-b04fa74c15b0"

[[env.production.kv_namespaces]]
binding = "ADMIN_SESSIONS"
id = "eea542853aed48cb94933b5ec022e35d"

[[env.production.routes]]
pattern = "clex.in/chain/*"
zone_name = "clex.in"

[[env.production.routes]]
pattern = "www.clex.in/chain/*"
zone_name = "clex.in"

[env.production.vars]
ALLOWED_ORIGIN = "https://clex.in, https://www.clex.in"
