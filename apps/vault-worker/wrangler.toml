name = "clex-vault"
main = "src/index.ts"
compatibility_date = "2024-05-29"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# ── Cron Triggers ──────────────────────────────────────────────────────────────
[triggers]
crons = ["0 * * * *"]   # every hour — runs pending file deletions

# ── KV Namespaces ──────────────────────────────────────────────────────────────
[[kv_namespaces]]
binding = "VAULT_SECRETS"
id = "5162af1e61064f4b83c2c610a4eb5242"

[[kv_namespaces]]
binding = "VAULT_TOKENS"
id = "eea542853aed48cb94933b5ec022e35d"

[[kv_namespaces]]
binding = "VAULT_SIGNALS"
id = "e50630ec62f64567be6dc57aaee809d6"

[[kv_namespaces]]
binding = "UPLOAD_QUOTA"
id = "e03c4c4e8f6c434cbb8db7b77da0860b"

# ── D1 Database ───────────────────────────────────────────────────────────────
[[d1_databases]]
binding = "DB"
database_name = "clex-vault"
database_id = "68d8ae50-6b96-46e2-85b2-4edbd4d3c0ba"

# ── R2 (file bytes) ───────────────────────────────────────────────────────────
# Replaces Supabase Storage, whose host stopped resolving entirely (CF 1016),
# which made every upload fail while the rest of the API kept working.
# Parked until R2 is enabled on the account. Wrangler refuses to deploy a
# worker whose R2 binding names a bucket that does not exist (code 10085), so
# leaving this active fails every CI deploy. src/storage.ts already answers
# 503 when no bucket is bound, so uploads report the truth meanwhile.
#
# To turn storage on: enable R2 in the Cloudflare dashboard, then
#   wrangler r2 bucket create clex-vault-files
#   (uncomment both blocks below, and in [env.production])
#   wrangler deploy --env production
# [[r2_buckets]]
# binding = "FILES"
# bucket_name = "clex-vault-files"

[vars]
ALLOWED_ORIGIN = "*"
MAX_SECRET_SIZE = "50000"
FIREBASE_PROJECT_ID = "clex-in"
# SUPABASE_URL, SUPABASE_ANON_KEY, SUPABASE_SERVICE_ROLE_KEY
# are set via: wrangler secret put <NAME> --env production

# ── Production ────────────────────────────────────────────────────────────────
[env.production]
name = "clex-vault-prod"

[env.production.triggers]
crons = ["0 * * * *"]

[[env.production.kv_namespaces]]
binding = "VAULT_SECRETS"
id = "5162af1e61064f4b83c2c610a4eb5242"

[[env.production.kv_namespaces]]
binding = "VAULT_TOKENS"
id = "eea542853aed48cb94933b5ec022e35d"

[[env.production.kv_namespaces]]
binding = "VAULT_SIGNALS"
id = "e50630ec62f64567be6dc57aaee809d6"

[[env.production.kv_namespaces]]
binding = "UPLOAD_QUOTA"
id = "e03c4c4e8f6c434cbb8db7b77da0860b"

[[env.production.d1_databases]]
binding = "DB"
database_name = "clex-vault"
database_id = "68d8ae50-6b96-46e2-85b2-4edbd4d3c0ba"

# [[env.production.r2_buckets]]
# binding = "FILES"
# bucket_name = "clex-vault-files"

[[env.production.routes]]
pattern = "clex.in/vault/api/*"
zone_name = "clex.in"

[env.production.vars]
ALLOWED_ORIGIN = "https://clex.in, https://www.clex.in"
MAX_SECRET_SIZE = "50000"
FIREBASE_PROJECT_ID = "clex-in"
# SUPABASE_URL, SUPABASE_ANON_KEY, SUPABASE_SERVICE_ROLE_KEY
# are set via: wrangler secret put <NAME> --env production
