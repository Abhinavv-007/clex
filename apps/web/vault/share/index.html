<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <!-- Fonts: one request, from <head>, so they download in parallel with the
       stylesheets instead of being chained behind a CSS @import. Geist is the
       display/body face, Pacifico the script accent, JetBrains Mono + Space
       Mono the monospace pair. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800;900&family=Hanken+Grotesk:wght@500;600;700;800;900&family=JetBrains+Mono:wght@400;500&family=Pacifico&display=swap">
  <script>document.documentElement.classList.add('clex-design-booting');</script>
  <link rel="icon" type="image/png" href="/brand/clex-logo.png">
  <link rel="apple-touch-icon" href="/brand/clex-logo.png">
  <title>Download Shared File — Clex Vault</title>
  <meta name="description" content="Download a privately shared file from Clex Vault.">
  <meta name="robots" content="noindex, nofollow">
  <script>
    // Theme bootstrap — must stay inline and render-blocking so the correct
    // palette is committed before first paint. Mirrors readTheme() in js/theme.js.
    (() => {
      try {
        const saved = localStorage.getItem('clex-theme-v2');
        const theme = (saved === 'dark' || saved === 'light')
          ? saved
          : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.classList.toggle('dark', theme === 'dark');
        document.documentElement.style.colorScheme = theme;
      } catch {
        document.documentElement.setAttribute('data-theme', 'light');
        document.documentElement.classList.remove('dark');
        document.documentElement.style.colorScheme = 'light';
      }
    })();
  </script>

  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/animations.css">
  <link rel="stylesheet" href="/css/pages/vault.css">
  <link rel="stylesheet" href="/css/global-enhance.css">
  <link rel="stylesheet" href="/css/creem-design.css">
  <link rel="stylesheet" href="/css/cinematic.css">

  <script type="module" src="/js/main.js"></script>
</head>

<body data-page="vault-share">

  <main class="vault-share-shell">
    <div id="vault-share-app-island"></div>
  </main>

</body>

</html>
