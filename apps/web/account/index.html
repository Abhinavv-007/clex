<!DOCTYPE html>
<html lang="en">
<head>
  <!-- @head -->
  <title>Your account — Clex</title>
  <meta name="description" content="Sign in to manage your Clex API keys across devices and raise your upload limits.">
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="/css/pages/pages.css">
</head>
<body data-page="account">
  <!-- @nav -->

  <main id="main">
    <header class="page-head page-head--compact stage-head tone-dark">
      <canvas class="stream-canvas" data-stream="soft" aria-hidden="true"></canvas>
      <div class="stream-veil" aria-hidden="true"></div>
      <div class="container page-head__inner">
        <span class="eyebrow eyebrow--center" data-reveal>Account</span>
        <h1 data-split>Your keys, <span class="script" data-write="now" data-delay="420">your way</span></h1>
        <p class="lede" data-reveal style="--d:600">Optional. Sign in to manage API keys across devices and raise your limits</p>
      </div>
    </header>

    <section class="section section--tight">
      <div class="container container--narrow">
        <div class="app-card app-card--lift">
          <div id="account-app-island" class="app-scope"></div>
        </div>
      </div>
    </section>
  </main>

  <!-- @footer -->
</body>
</html>
