<!DOCTYPE html>
<html lang="en">
<head>
  <!-- @head -->
  <title>Receive a file — Clex</title>
  <meta name="description" content="Enter a Clex code to receive files straight from another browser, verified chunk by chunk. Nothing is stored on a server.">
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="/css/pages/pages.css">
</head>
<body data-page="receive">
  <!-- @nav -->

  <main id="main">
    <header class="page-head page-head--compact stage-head">
      <canvas class="stream-canvas" data-stream="soft" aria-hidden="true"></canvas>
      <div class="stream-veil" aria-hidden="true"></div>
      <div class="container page-head__inner">
        <span class="eyebrow eyebrow--center" data-reveal>Receive</span>
        <h1 data-split>Catch <span class="script" data-write="now" data-delay="420">a file</span></h1>
        <p class="lede" data-reveal style="--d:600">Type the six character code you were given, or open the link they sent. It arrives straight from their browser</p>
      </div>
    </header>

    <section class="section section--tight">
      <div class="container container--narrow">
        <div class="app-card app-card--lift">
          <div id="receive-app-island" class="app-scope"></div>
        </div>
      </div>
    </section>
  </main>

  <!-- @footer -->
</body>
</html>
