name = "clex-signaling"
main = "src/index.ts"
compatibility_date = "2024-05-29"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[durable_objects]
bindings = [
  { name = "ROOMS", class_name = "Room" },
  { name = "YJS_ROOMS", class_name = "YjsSignalRoom" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# YjsSignalRoom keeps its topic map in memory only — a dropped connection
# re-subscribes anyway — but the free plan requires durable objects to be
# declared as SQLite classes, so it is registered the same way Room is.
[[migrations]]
tag = "v2"
new_sqlite_classes = ["YjsSignalRoom"]

[vars]
ALLOWED_ORIGIN = "*"

[env.production]
name = "clex-signaling-prod"

[env.production.durable_objects]
bindings = [
  { name = "ROOMS", class_name = "Room" },
  { name = "YJS_ROOMS", class_name = "YjsSignalRoom" }
]

[[env.production.migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[env.production.migrations]]
tag = "v2"
new_sqlite_classes = ["YjsSignalRoom"]

[env.production.vars]
ALLOWED_ORIGIN = "https://clex.in, https://www.clex.in"

[[env.production.routes]]
pattern = "signal.clex.in"
custom_domain = true
