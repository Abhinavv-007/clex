name = "clex-api"
main = "src/index.ts"
compatibility_date = "2024-05-29"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[vars]
ALLOWED_ORIGIN = "*"
FRONTEND_BASE_URL = "http://localhost:3000"
GOOGLE_REDIRECT_URI = "http://localhost:8788/api/auth/google/callback"
GOOGLE_DRIVE_SCOPE = "https://www.googleapis.com/auth/drive.file"

[env.production]
name = "clex-api-prod"
routes = [
  { pattern = "clex.in/api/*", zone_name = "clex.in" },
  { pattern = "www.clex.in/api/*", zone_name = "clex.in" }
]

[env.production.vars]
ALLOWED_ORIGIN = "https://clex.in, https://www.clex.in"
FRONTEND_BASE_URL = "https://clex.in"
GOOGLE_REDIRECT_URI = "https://clex.in/api/auth/google/callback"
GOOGLE_DRIVE_SCOPE = "https://www.googleapis.com/auth/drive.file"
