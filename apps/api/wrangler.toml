name = "clex-api"
main = "src/index.ts"
compatibility_date = "2024-05-29"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[triggers]
crons = ["0 * * * *"]

[[kv_namespaces]]
binding = "DRIVE_SESSION_STORE"
id = "eea542853aed48cb94933b5ec022e35d"

[vars]
ALLOWED_ORIGIN = "*"
FRONTEND_BASE_URL = "http://localhost:3000"
GOOGLE_REDIRECT_URI = "http://localhost:8788/api/auth/google/callback"
GOOGLE_DRIVE_SCOPE = "openid email profile https://www.googleapis.com/auth/drive.file"
FIREBASE_PROJECT_ID = "clex-in"
WEBAUTHN_RP_ID = "localhost"
WEBAUTHN_RP_NAME = "Clex Admin"

[env.production]
name = "clex-api-prod"
routes = [
  { pattern = "clex.in/api/*", zone_name = "clex.in" },
  { pattern = "www.clex.in/api/*", zone_name = "clex.in" },
  # api.clex.in is the operator-facing surface: hosts the /dashboard SPA
  # at the apex and serves the same /api/* JSON. Everything routes to the
  # same worker — only the hostname differs, so the existing CORS allow
  # list (clex.in, www.clex.in) still gates browser fetches.
  { pattern = "api.clex.in/*", zone_name = "clex.in" }
]

[env.production.triggers]
crons = ["0 * * * *"]

[[env.production.kv_namespaces]]
binding = "DRIVE_SESSION_STORE"
id = "eea542853aed48cb94933b5ec022e35d"

[env.production.vars]
ALLOWED_ORIGIN = "https://clex.in, https://www.clex.in"
FRONTEND_BASE_URL = "https://clex.in"
GOOGLE_REDIRECT_URI = "https://clex.in/api/auth/google/callback"
GOOGLE_DRIVE_SCOPE = "openid email profile https://www.googleapis.com/auth/drive.file"
FIREBASE_PROJECT_ID = "clex-in"
WEBAUTHN_RP_ID = "clex.in"
WEBAUTHN_RP_NAME = "Clex Admin"
